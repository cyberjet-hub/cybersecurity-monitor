[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersecurity-monitor"
version = "0.1.0"
description = "Analyze login logs and detect suspicious authentication patterns."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "cyberjet-hub" }]
license = { text = "MIT" }
dependencies = [
  "Flask>=3.0.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
